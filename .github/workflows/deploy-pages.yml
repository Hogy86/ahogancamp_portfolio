name: Deploy Vanguard vs. Sentinels to GitHub Pages

# Interim/stopgap public deployment (see infra/aws/ for the primary AWS
# deployment, currently blocked on AWS account verification for CloudFront).
# Publishes the built game to GitHub Pages at
# https://<owner>.github.io/ahogancamp_portfolio/
#
# actions/upload-pages-artifact uploads the CONTENTS of the given path as the
# site root - it does not nest them under a subfolder. An earlier version of
# this workflow set VITE_BASE_PATH to a /vanguard-vs-sentinels/ subpath while
# still uploading dist/ straight to the artifact root, so the built
# index.html referenced asset URLs one directory level deeper than where
# they actually deployed (asset requests 404'd even though index.html itself
# loaded). VITE_BASE_PATH now matches where the artifact actually lands.
#
# docs/mobile/architecture/mobile-architecture.md §10/§10.3 (M-ADR-0008,
# amended by M-ADR-0011/0012 and Amendment A8): once the Android project
# existed, `android-build` and `mobile-e2e` were added so a change that
# breaks either version blocks the website deploy (C4, .claude/CLAUDE.md
# §One codebase). Least-privilege permissions and split concurrency per M3.

on:
  push:
    branches: [master]
    paths:
      - "projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {} # allows manually re-running from the Actions tab

permissions:
  contents: read

# §10.3: workflow-level concurrency so a PR run can never cancel a master
# deploy. The `deploy` job below keeps its own `group: pages` unchanged, so
# the master-deploy cancellation behavior itself is unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # §7.5.3 / §14.1 row N3: whole-repository secret scan, before npm ci.
      - run: node scripts/check-no-secrets.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/package-lock.json

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint

      - run: npm run test -- --run

      # npm run build already runs `tsc --noEmit` before `vite build`
      # (package.json), so typecheck failures block the deploy too.
      - run: npm run build
        env:
          # GitHub Pages serves a project repo (not a <user>.github.io repo)
          # under /<repo-name>/... - vite.config.ts reads this to emit
          # correctly-prefixed asset paths. The Docker and AWS deployments
          # don't set this and default to base '/' (domain root), unaffected
          # by this workflow. Must match where upload-pages-artifact actually
          # deploys dist/'s contents (the site root), not a subpath.
          VITE_BASE_PATH: /ahogancamp_portfolio/

      # §10 item 1: proves the web bundle never contains Capacitor code
      # (C3) - the Android module is only reachable via the mode-gated
      # dynamic import in src/main.ts, which Vite strips from this build.
      - name: Web-bundle purity check
        run: |
          if grep -rlE "@capacitor|registerPlugin" dist/assets/*.js; then
            echo "Capacitor code found in the web bundle - see mobile-architecture.md §3.1" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/dist

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # H4(a): pinned to the full 40-hex commit SHA (L5, binding) - the `# vX.Y.Z`
      # comment is the human-readable version that SHA currently resolves to.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/package-lock.json

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - run: npm ci

      - run: npm run build:android

      - run: npx cap sync android

      - run: node scripts/check-capacitor-config.mjs

      # H4(b): aapt2 is not on ubuntu-latest's PATH. Pin a build-tools version
      # (matching android/variables.gradle's compileSdkVersion) via sdkmanager so the
      # resolved aapt2 path is deterministic rather than "highest installed" guesswork.
      - name: Install aapt2 (build-tools 36.0.0)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
          echo "AAPT2_PATH=$ANDROID_HOME/build-tools/36.0.0/aapt2" >> "$GITHUB_ENV"

      - name: assembleDebug
        working-directory: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Manifest check (debug)
        run: node scripts/check-android-manifest.mjs --variant debug --apk android/app/build/outputs/apk/debug/app-debug.apk

      - name: assembleRelease (unsigned, CI-only)
        working-directory: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/android
        env:
          CI: "true"
        run: ./gradlew assembleRelease -PvvsCiUnsignedRelease=true --no-daemon

      - name: Manifest check (unsigned release)
        run: node scripts/check-android-manifest.mjs --variant release --apk android/app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  mobile-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build:android

      - run: npm run test:e2e:mobile

  deploy:
    needs: [build, android-build, mobile-e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # §10.3: this job's own concurrency group stays `pages` (unchanged from
    # before A4), so master-deploy behavior is unaffected. The workflow-level
    # group above is what stops a PR run from cancelling a master deploy.
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
