name: Deploy Vanguard vs. Sentinels to GitHub Pages

# Interim/stopgap public deployment (see infra/aws/ for the primary AWS
# deployment, currently blocked on AWS account verification for CloudFront).
# Publishes the built game to GitHub Pages at
# https://<owner>.github.io/ahogancamp_portfolio/
#
# actions/upload-pages-artifact uploads the CONTENTS of the given path as the
# site root - it does not nest them under a subfolder. An earlier version of
# this workflow set VITE_BASE_PATH to a /vanguard-vs-sentinels/ subpath while
# still uploading dist/ straight to the artifact root, so the built
# index.html referenced asset URLs one directory level deeper than where
# they actually deployed (asset requests 404'd even though index.html itself
# loaded). VITE_BASE_PATH now matches where the artifact actually lands.

on:
  push:
    branches: [master]
    paths:
      - "projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {} # allows manually re-running from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment should ever run at a time; a newer push
# supersedes an in-flight older one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test -- --run

      # npm run build already runs `tsc --noEmit` before `vite build`
      # (package.json), so typecheck failures block the deploy too.
      - run: npm run build
        env:
          # GitHub Pages serves a project repo (not a <user>.github.io repo)
          # under /<repo-name>/... - vite.config.ts reads this to emit
          # correctly-prefixed asset paths. The Docker and AWS deployments
          # don't set this and default to base '/' (domain root), unaffected
          # by this workflow. Must match where upload-pages-artifact actually
          # deploys dist/'s contents (the site root), not a subpath.
          VITE_BASE_PATH: /ahogancamp_portfolio/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/ai-ml/VibeCoding/ClaudeCode-UFOArcadeGame/scaffold/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
