# Blocks any PR whose agent files drop the token-tuning rules (see scripts/check-agents.mjs).
name: agents-check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  agents-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run agents:check
      - run: npm run test:template
