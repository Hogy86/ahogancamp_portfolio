# nginx main config for serving the static Vanguard vs. Sentinels build.
#
# Runs as an unprivileged process (see Dockerfile: `user` directive omitted
# here because the master process itself runs as the container's non-root
# user — no privileged worker/master split is needed since we never bind
# to a port <1024). Logs go to stdout/stderr so they're captured by the
# container runtime instead of requiring a writable log directory.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Access/error logs to stdout/stderr — no writable filesystem path needed,
  # compatible with the read-only root filesystem required by
  # security-review-v2.md carry-forward item 3.
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile        on;
  keepalive_timeout 65;

  # nginx needs a few writable scratch directories at runtime (temp buffers,
  # client body, proxy, etc.). With a read-only root filesystem these are
  # provided via tmpfs mounts in docker-compose.yml (see /var/cache/nginx,
  # /tmp). Redirect nginx's default temp paths there explicitly.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (security-review-v2.md carry-forward item 2) ----
    # Strict CSP: the app has zero runtime third-party dependencies and no
    # inline scripts/styles (confirmed in security-review-v2.md, constraint 5),
    # so this is achievable with no code changes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Hashed static assets (JS/CSS/sourcemaps) are safe to cache aggressively;
    # index.html is not (it references the current hashed asset names).
    location ~* \.(?:js|css|map|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "DENY" always;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
