services:
  arcade-ufo:
    build: .
    image: arcade-ufo:local
    env_file:
      - .env
    environment:
      TLS_MODE: ${TLS_MODE:-https}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/certs/localhost.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/certs/localhost-key.pem}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      HTTP_PORT: ${HTTP_PORT:-80}
    ports:
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ${HOST_CERT_DIR:-./certs}:/certs:ro
